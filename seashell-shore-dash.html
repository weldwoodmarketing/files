<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐚 Seashell Shore Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #2a6f97;
    font-family: 'Comic Sans MS', 'Baloo', 'Trebuchet MS', sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, #7ec8e3, #2a6f97);
  }
  canvas {
    display: block;
    background: #ffe7c2;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    border-radius: 8px;
    max-width: 100%; max-height: 100%;
    image-rendering: auto;
  }

  /* "Rotate your phone" hint — shown on touch devices held in portrait */
  #rotate {
    display: none;
    position: fixed; inset: 0; z-index: 50;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px;
    color: #fff;
    background: linear-gradient(160deg, #2a6f97 0%, #3a8bb0 45%, #6cc1d6 100%);
  }
  #rotate .phone {
    width: 76px; height: 134px;
    border: 7px solid #fff; border-radius: 16px;
    margin-bottom: 30px;
    background: rgba(255,255,255,0.18);
    animation: tip 2s ease-in-out infinite;
  }
  @keyframes tip {
    0%, 30% { transform: rotate(0deg); }
    60%, 100% { transform: rotate(-90deg); }
  }
  #rotate h2 { font-size: 30px; margin-bottom: 10px; text-shadow: 0 3px 0 #1d4e6b; }
  #rotate p { font-size: 19px; opacity: 0.95; max-width: 320px; }
  #rotate .anyway {
    margin-top: 26px; padding: 12px 26px;
    background: #ff6aa0; color: #fff; font-weight: bold; font-size: 18px;
    border: none; border-radius: 24px;
    font-family: inherit; box-shadow: 0 5px 0 rgba(0,0,0,0.18);
  }
  @media (orientation: portrait) and (max-width: 1024px) and (pointer: coarse) {
    body:not(.rotate-dismissed) #rotate { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate">
  <div class="phone"></div>
  <h2>🐚 Turn your phone sideways!</h2>
  <p>Seashell Shore Dash is bigger and comfier in landscape.</p>
  <button class="anyway" type="button">Play anyway</button>
</div>
<script>
(function () {
"use strict";

// let players who can't rotate dismiss the hint
(function () {
  var btn = document.querySelector('#rotate .anyway');
  if (btn) btn.addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
    document.body.classList.add('rotate-dismissed');
  });
})();

// ---------------------------------------------------------------------------
// Seashell Shore Dash — a gentle side-scrolling collect-a-thon for ages 4-8.
// A little girl with bubble braids runs along the beach. The top of the screen
// shows an order of 10 seashells. Run into the matching shell to collect it,
// JUMP over every other shell. The shore scrolls faster each of the 10 levels.
// Single self-contained file, Canvas API, no dependencies.
// ---------------------------------------------------------------------------

var DW = 960, DH = 600;            // design resolution (game logic coords)
var GROUND_Y = 500;                // y of the sand surface where feet/shells sit
var GIRL_X = 230;                  // fixed x where the girl runs

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');
var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
var scale = 1, offX = 0, offY = 0;

function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min(vw / DW, vh / DH);
  scale = s;
  var cssW = DW * s, cssH = DH * s;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(DW * s * dpr);
  canvas.height = Math.round(DH * s * dpr);
  offX = (vw - cssW) / 2; offY = (vh - cssH) / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Tiny sound helper (WebAudio). Only after first user gesture.
// ---------------------------------------------------------------------------
var AC = null, soundOn = true;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
  return AC;
}
function beep(freq, dur, type, vol, when) {
  if (!soundOn) return;
  var ac = audio(); if (!ac) return;
  var t0 = ac.currentTime + (when || 0);
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.18, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sCollect() { beep(660, 0.12, 'sine', 0.2); beep(990, 0.14, 'sine', 0.18, 0.08); beep(1320, 0.16, 'sine', 0.16, 0.16); }
function sJump()    { beep(520, 0.10, 'square', 0.10); beep(760, 0.10, 'square', 0.08, 0.05); }
function sTrip()    { beep(200, 0.22, 'sawtooth', 0.14); beep(150, 0.26, 'sawtooth', 0.12, 0.08); }
function sLevel()   { var n=[523,659,784,1047]; for(var i=0;i<n.length;i++) beep(n[i],0.18,'sine',0.2,i*0.12); }
function sWin()     { var n=[523,659,784,1047,1319,1047,1319]; for(var i=0;i<n.length;i++) beep(n[i],0.22,'sine',0.22,i*0.14); }
function sClick()   { beep(1500, 0.025, 'square', 0.07); beep(1850, 0.022, 'square', 0.05, 0.035); }  // crab claws
function sPinch()   { beep(320, 0.08, 'square', 0.13); beep(220, 0.12, 'sawtooth', 0.12, 0.05); }       // crab pinch
function sHeartGain(){ beep(784, 0.10, 'sine', 0.18); beep(1047, 0.12, 'sine', 0.18, 0.08); beep(1319, 0.16, 'sine', 0.16, 0.18); }

// ---------------------------------------------------------------------------
// Upbeat tropical music — warm marimba / steel-drum tones, a bouncy bass, a
// soft pad drone, and island percussion (congas + shaker + light kick). Every
// level plays a DIFFERENT song: its own key, chord progression, tempo, melody
// shape and groove. Built live with a small WebAudio scheduler.
// ---------------------------------------------------------------------------
var NOTE = {};
(function () {
  var names = ['C','Cs','D','Ds','E','F','Fs','G','Gs','A','As','B'];
  for (var o = 2; o <= 6; o++) {
    for (var i = 0; i < 12; i++) {
      var midi = (o + 1) * 12 + i;            // C2 = MIDI 36
      NOTE[names[i] + o] = 440 * Math.pow(2, (midi - 69) / 12);
    }
  }
})();

// melody shapes: indexes into a chord's tone pool [root,3rd,5th,root8,3rd8,5th8]
var SHAPES = [
  [{d:0,s:1},{d:1,s:1},{d:2,s:1},{d:1,s:1},{d:2,s:2},{d:0,s:2}],
  [{d:2,s:2},{d:1,s:1},{d:0,s:1},{d:2,s:2},{d:3,s:2}],
  [{d:0,s:1},{d:2,s:1},{d:4,s:1},{d:2,s:1},{d:3,s:2},{d:1,s:2}],
  [{d:4,s:2},{d:3,s:1},{d:2,s:1},{d:1,s:2},{d:0,s:2}],
  [{d:0,s:2},{d:2,s:2},{d:4,s:2},{d:2,s:2}],
  [{d:1,s:1},{d:2,s:1},{d:3,s:1},{d:4,s:1},{d:3,s:1},{d:2,s:1},{d:0,s:2}],
  [{d:3,s:3},{d:2,s:1},{d:1,s:2},{d:0,s:2}],
  [{d:0,s:1},{d:1,s:1},{d:2,s:1},{d:3,s:1},{d:4,s:1},{d:3,s:1},{d:2,s:1},{d:1,s:1}]
];
// conga grooves (per eighth of a bar): L = low conga, H = high, '-' = rest
var PERC = [
  ['L','-','-','H','L','-','H','-'],
  ['L','-','H','-','-','L','H','-'],
  ['L','H','-','H','L','-','H','H']
];
// One distinct song per level: name, tempo, groove, melody shape, chord prog.
var SONGS = [
  { name:'Sunny Cove',   stepDur:0.20,  perc:0, kick:true,  shape:0, prog:[['C4','maj'],['F4','maj'],['G4','maj'],['C4','maj']] },
  { name:'Palm Breeze',  stepDur:0.19,  perc:1, kick:true,  shape:2, prog:[['G4','maj'],['E4','min'],['C4','maj'],['D4','maj']] },
  { name:'Blue Lagoon',  stepDur:0.185, perc:2, kick:true,  shape:4, prog:[['D4','maj'],['A4','maj'],['B4','min'],['G4','maj']] },
  { name:'Mango Shake',  stepDur:0.175, perc:1, kick:false, shape:6, prog:[['B4','min7'],['E4','dom7'],['A4','maj7'],['Fs4','min7']] },
  { name:'Coral Reef',   stepDur:0.205, perc:0, kick:true,  shape:1, prog:[['F4','maj'],['As4','maj'],['G4','min'],['C4','maj']] },
  { name:'Island Hop',   stepDur:0.18,  perc:2, kick:true,  shape:3, prog:[['As4','maj'],['F4','maj'],['G4','min'],['Ds4','maj']] },
  { name:'Tiki Time',    stepDur:0.17,  perc:1, kick:true,  shape:7, prog:[['E4','maj'],['A4','maj'],['B4','maj'],['A4','maj']] },
  { name:'Sea Turtle',   stepDur:0.205, perc:0, kick:false, shape:4, prog:[['Ds4','maj'],['C4','min'],['F4','min'],['As4','maj']] },
  { name:'Hula Sway',    stepDur:0.19,  perc:2, kick:true,  shape:5, prog:[['A4','min'],['G4','maj'],['F4','maj'],['E4','maj']] },
  { name:'Sunset Limbo', stepDur:0.195, perc:1, kick:true,  shape:1, prog:[['D4','min'],['G4','min'],['A4','maj'],['D4','min']] }
];
var music = { playing:false, timer:null, stepDur:0.19, voices:null, master:null, stepTime:0, step:0, perc:PERC[0], kick:true, noiseBuf:null };

function buildNoise(ac) {
  var len = Math.floor(ac.sampleRate * 0.3);
  var buf = ac.createBuffer(1, len, ac.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function musOut() { return music.master || AC.destination; }
function normFreq(f) { while (f < 196) f *= 2; while (f >= 392) f /= 2; return f; }

// ---- tropical instruments ----
function mallet(ac, f, t, dur, vol) {            // marimba / steel-drum pluck
  var parts = [[1, 1.0], [2, 0.45], [3, 0.12]];
  for (var i = 0; i < parts.length; i++) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f * parts[i][0];
    var pv = vol * parts[i][1];
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(pv, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musOut());
    o.start(t); o.stop(t + dur + 0.02);
  }
}
function bassPluck(ac, f, t, dur, vol) {
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musOut());
  o.start(t); o.stop(t + dur + 0.02);
}
function padNote(ac, f, t, dur, vol) {           // warm sustained drone
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.12);
  g.gain.setValueAtTime(vol, t + dur * 0.6);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musOut());
  o.start(t); o.stop(t + dur + 0.05);
}
function conga(ac, t, hi, vol) {
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  var f0 = hi ? 330 : 180;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + 0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(musOut());
  o.start(t); o.stop(t + 0.2);
}
function shaker(ac, t, accent) {
  if (!music.noiseBuf) return;
  var src = ac.createBufferSource(); src.buffer = music.noiseBuf;
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(accent ? 0.03 : 0.016, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  src.connect(hp); hp.connect(g); g.connect(musOut());
  src.start(t); src.stop(t + 0.07);
}
function softKick(ac, t) {
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(120, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
  o.connect(g); g.connect(musOut());
  o.start(t); o.stop(t + 0.18);
}

// Expand a song's chord progression into lead / bass / arp / pad note lists.
function buildSong(song) {
  var lead = [], bass = [], arp = [], pad = [];
  function semi(n) { return Math.pow(2, n / 12); }
  for (var b = 0; b < song.prog.length; b++) {
    var pc = song.prog[b];
    var root = normFreq(NOTE[pc[0]]);
    var minor = (pc[1] === 'min' || pc[1] === 'min7');
    var third = root * semi(minor ? 3 : 4);
    var fifth = root * semi(7);
    var pool = [root, third, fifth, root * 2, third * 2, fifth * 2];
    var sh = SHAPES[song.shape];
    for (var k = 0; k < sh.length; k++) lead.push({ f: pool[sh[k].d], s: sh[k].s });
    var rl = root / 2, fl = fifth / 2;
    bass.push({ f: rl, s: 2 }, { f: rl, s: 2 }, { f: fl, s: 2 }, { f: rl, s: 2 });
    var seq = [root, third, fifth, third, root, third, fifth, third];
    for (var m = 0; m < 8; m++) arp.push({ f: seq[m], s: 1 });
    pad.push({ f: root, s: 8 });
  }
  return { lead: lead, bass: bass, arp: arp, pad: pad };
}

function scheduleMusic() {
  if (!music.playing || !AC) return;
  var ahead = AC.currentTime + 0.2;
  for (var v = 0; v < music.voices.length; v++) {
    var vo = music.voices[v];
    while (vo.next < ahead) {
      var note = vo.seq[vo.i];
      var dur = note.s * music.stepDur;
      if (note.f > 0) vo.fn(AC, note.f, vo.next, dur * vo.ring, vo.vol);
      vo.next += dur;
      vo.i = (vo.i + 1) % vo.seq.length;
    }
  }
  // island percussion on the eighth-note clock
  while (music.stepTime < ahead) {
    var pos = music.step % 8;
    shaker(AC, music.stepTime, pos % 2 === 1);
    var hit = music.perc[pos];
    if (hit === 'L') conga(AC, music.stepTime, false, 0.13);
    else if (hit === 'H') conga(AC, music.stepTime, true, 0.11);
    if (music.kick && (pos === 0 || pos === 4)) softKick(AC, music.stepTime);
    music.stepTime += music.stepDur;
    music.step++;
  }
}
function startMusic() {
  if (!soundOn) return;
  var ac = audio(); if (!ac) return;
  if (ac.state === 'suspended') ac.resume();
  stopMusic();
  if (!music.noiseBuf) music.noiseBuf = buildNoise(ac);
  var song = SONGS[(level - 1) % SONGS.length];
  var built = buildSong(song);
  music.stepDur = song.stepDur;
  music.perc = PERC[song.perc];
  music.kick = song.kick;
  // master compressor -> destination, so the warm mix stays even
  var comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 4;
  comp.attack.value = 0.004; comp.release.value = 0.25;
  var mg = ac.createGain(); mg.gain.value = 0.95;
  comp.connect(mg); mg.connect(ac.destination);
  music.master = comp;
  var t0 = ac.currentTime + 0.16;
  music.voices = [
    { seq: built.lead, fn: mallet,    vol: 0.15,  ring: 1.7,  i: 0, next: t0 },
    { seq: built.arp,  fn: mallet,    vol: 0.055, ring: 1.25, i: 0, next: t0 },
    { seq: built.bass, fn: bassPluck, vol: 0.13,  ring: 0.95, i: 0, next: t0 },
    { seq: built.pad,  fn: padNote,   vol: 0.05,  ring: 0.98, i: 0, next: t0 }
  ];
  music.stepTime = t0; music.step = 0;
  music.playing = true;
  if (music.timer) clearInterval(music.timer);
  music.timer = setInterval(scheduleMusic, 30);
  scheduleMusic();
}
function stopMusic() {
  music.playing = false;
  if (music.timer) { clearInterval(music.timer); music.timer = null; }
  music.master = null;
}

// ---------------------------------------------------------------------------
// Seashell kinds. Each has a name, a bright color and a draw routine. Young
// players match by shape AND color, so the kinds are kept very distinct.
// ---------------------------------------------------------------------------
function lighten(hex, amt) {
  var c = parseInt(hex.slice(1), 16);
  var r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
  r = Math.min(255, Math.round(r + (255 - r) * amt));
  g = Math.min(255, Math.round(g + (255 - g) * amt));
  b = Math.min(255, Math.round(b + (255 - b) * amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function darken(hex, amt) {
  var c = parseInt(hex.slice(1), 16);
  var r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
  r = Math.round(r * (1 - amt)); g = Math.round(g * (1 - amt)); b = Math.round(b * (1 - amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

var KINDS = [
  { name: 'Pink Fan',    color: '#ff7eb3', shape: 'scallop' },
  { name: 'Orange Conch',color: '#ff9f43', shape: 'conch'   },
  { name: 'Purple Clam', color: '#a55eea', shape: 'clam'    },
  { name: 'Yellow Star', color: '#ffd93d', shape: 'star'    },
  { name: 'White Disc',  color: '#f2f6ff', shape: 'sand'    },
  { name: 'Teal Swirl',  color: '#3ec9c9', shape: 'snail'   }
];

// Draw a shell of the given kind centred at (cx,cy) with overall radius r.
function drawShell(g, kind, cx, cy, r) {
  var K = KINDS[kind], col = K.color;
  g.save();
  g.translate(cx, cy);
  g.lineJoin = 'round'; g.lineCap = 'round';
  g.lineWidth = Math.max(1.5, r * 0.09);
  g.strokeStyle = darken(col === '#f2f6ff' ? '#cfd8ea' : col, 0.35);
  var grad = g.createLinearGradient(0, -r, 0, r);
  grad.addColorStop(0, lighten(col, 0.35));
  grad.addColorStop(1, col);
  g.fillStyle = grad;

  if (K.shape === 'scallop') {
    // fan-shaped scallop with ridges
    g.beginPath();
    g.moveTo(0, r * 0.72);
    var ribs = 7;
    for (var i = 0; i <= ribs; i++) {
      var a = Math.PI + (i / ribs) * Math.PI;
      var rr = r * (i % 2 === 0 ? 1.0 : 0.86);
      g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr * 0.9 + r * 0.1);
    }
    g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = darken(col, 0.18); g.lineWidth = r * 0.06;
    for (var j = 1; j < ribs; j++) {
      var aa = Math.PI + (j / ribs) * Math.PI;
      g.beginPath(); g.moveTo(0, r * 0.5);
      g.lineTo(Math.cos(aa) * r * 0.82, Math.sin(aa) * r * 0.78 + r * 0.1);
      g.stroke();
    }
  } else if (K.shape === 'conch') {
    // pointed spiral conch
    g.beginPath();
    g.ellipse(0, 0, r * 0.95, r, 0, 0, Math.PI * 2);
    g.fill(); g.stroke();
    g.fillStyle = lighten(col, 0.5);
    g.beginPath(); g.ellipse(-r * 0.15, -r * 0.1, r * 0.45, r * 0.6, -0.3, 0, Math.PI * 2); g.fill();
    g.strokeStyle = darken(col, 0.2); g.lineWidth = r * 0.07;
    for (var s = 0; s < 4; s++) {
      g.beginPath();
      g.ellipse(0, r * 0.15 - s * r * 0.18, r * (0.75 - s * 0.16), r * (0.4 - s * 0.06), 0, Math.PI * 0.1, Math.PI * 0.95);
      g.stroke();
    }
  } else if (K.shape === 'clam') {
    // rounded clam with hinge ridges
    g.beginPath();
    g.moveTo(-r, r * 0.45);
    g.quadraticCurveTo(-r * 1.02, -r * 0.55, 0, -r * 0.95);
    g.quadraticCurveTo(r * 1.02, -r * 0.55, r, r * 0.45);
    g.quadraticCurveTo(0, r * 0.75, -r, r * 0.45);
    g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = darken(col, 0.18); g.lineWidth = r * 0.06;
    for (var c2 = -2; c2 <= 2; c2++) {
      g.beginPath(); g.moveTo(0, r * 0.55);
      g.lineTo(c2 * r * 0.34, -r * 0.7); g.stroke();
    }
  } else if (K.shape === 'star') {
    // chunky 5-point starfish
    g.beginPath();
    for (var p = 0; p < 10; p++) {
      var ang = -Math.PI / 2 + p * Math.PI / 5;
      var rad = (p % 2 === 0) ? r : r * 0.45;
      var x = Math.cos(ang) * rad, y = Math.sin(ang) * rad;
      if (p === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.closePath(); g.fill(); g.stroke();
    g.fillStyle = darken(col, 0.16);
    for (var d = 0; d < 5; d++) {
      var an = -Math.PI / 2 + d * 2 * Math.PI / 5;
      g.beginPath(); g.arc(Math.cos(an) * r * 0.5, Math.sin(an) * r * 0.5, r * 0.07, 0, Math.PI * 2); g.fill();
    }
  } else if (K.shape === 'sand') {
    // sand dollar disc with 5-petal flower
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill(); g.stroke();
    g.strokeStyle = darken('#cfd8ea', 0.18); g.lineWidth = r * 0.05;
    for (var f = 0; f < 5; f++) {
      var fa = -Math.PI / 2 + f * 2 * Math.PI / 5;
      g.beginPath();
      g.ellipse(Math.cos(fa) * r * 0.32, Math.sin(fa) * r * 0.32, r * 0.16, r * 0.42, fa + Math.PI / 2, 0, Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = darken('#cfd8ea', 0.12);
    g.beginPath(); g.arc(0, 0, r * 0.08, 0, Math.PI * 2); g.fill();
  } else if (K.shape === 'snail') {
    // round swirl/snail shell
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill(); g.stroke();
    g.strokeStyle = darken(col, 0.28); g.lineWidth = r * 0.13;
    g.beginPath();
    var steps = 36, maxA = Math.PI * 3.4;
    for (var t = 0; t <= steps; t++) {
      var th = (t / steps) * maxA;
      var rr2 = r * 0.92 * (1 - t / steps);
      var xx = Math.cos(th) * rr2, yy = Math.sin(th) * rr2;
      if (t === 0) g.moveTo(xx, yy); else g.lineTo(xx, yy);
    }
    g.stroke();
  }
  g.restore();
}

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
var TOTAL_LEVELS = 10;
var state = 'menu';   // menu | story | play | levelclear | gameover | win
var storyLevel = 1;   // which level the story card is introducing
var level = 1;
var order = [];       // array of 10 kind indices to collect, in order
var collected = 0;    // how many of the order are done
var hearts = 3;
var heartsLost = 0;   // hearts lost this level (drives the rescue-heart pickups)
var heartsToSpawn = 0;// queued rescue-heart pickups to drop into the stream
var rainbowT = 0;     // level-complete rainbow sweep progress
var shells = [];      // active shells on the shore (also crabs and heart pickups)
var distToSpawn = 0;
var scroll = 0;       // world scroll distance (for parallax + ground texture)
var sparkles = [];
var bgItems = [];     // decorative ground pebbles/starfish (parallax, no gameplay)
var decor = [];       // scattered seashells resting on the beach (decor, no gameplay)
var palms = [];       // background palm trees (parallax)
var creatures = [];   // dolphins / whales / seals / turtles breaching the ocean
var spawnCreatureTimer = 1.5;
var bannerTimer = 0;  // shows the level name at the start of a level
var time = 0;
var flashTimer = 0;   // red stumble flash
var cheerTimer = 0;
var score = 0;        // points this playthrough (+10 per shell, +50 per level)
var popups = [];      // floating "+10" score text
var bestLevel = loadBest();
var bestScore = loadBestScore();

var girl = { feetY: GROUND_Y, vy: 0, jumping: false, runPhase: 0, stumble: 0, bob: 0 };

function loadBest() { try { return parseInt(localStorage.getItem('seashellBest') || '1', 10) || 1; } catch (e) { return 1; } }
function saveBest(v) { try { localStorage.setItem('seashellBest', String(v)); } catch (e) {} }
function loadBestScore() { try { return parseInt(localStorage.getItem('seashellBestScore') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBestScore(v) { try { localStorage.setItem('seashellBestScore', String(v)); } catch (e) {} }
function addScore(pts, x, y, label) {
  score += pts;
  if (score > bestScore) { bestScore = score; saveBestScore(bestScore); }
  if (label) popups.push({ x: x, y: y, text: label, life: 0.9 });
}

function levelSpeed(lv) {
  // gentle ramp: ~250 px/s at L1 up to ~470 px/s at L10
  return 250 + (lv - 1) * 24;
}

function randKind() { return (Math.random() * KINDS.length) | 0; }

// A small seashell half-buried in the sand — purely decorative so the beach
// looks strewn with shells. Placed above or below the running line, never on it.
function makeDecor(x) {
  var up = Math.random() < 0.5;
  var y = up ? (GROUND_Y - 64 - Math.random() * 36)     // up the beach toward the water
             : (GROUND_Y + 42 + Math.random() * 70);    // down in the foreground
  return { x: x, y: y, kind: randKind(), s: 7 + Math.random() * 7, rot: (Math.random() - 0.5) * 0.9 };
}

// A little story told one snippet at a time, before each level.
var STORY = [
  ['Pearl skips onto Sunny Cove at sunrise.', 'A tiny shell whispers: "Help me build the', 'Rainbow Necklace to wake the sleepy sea!"', 'Collect 10 shells — in the right order!'],
  ['The warm Palm Breeze tickles Pearl’s braids.', 'Two dolphins leap and point down the shore:', '"This way to the next shiny shells!"'],
  ['At the Blue Lagoon, click-clacking crabs', 'scuttle across the sand. Hop over them', 'and grab only the shells on your list!'],
  ['A friendly seal shares a cool mango shake.', '"Yum! Now go find more shells, Pearl!"', 'The necklace is starting to sparkle.'],
  ['By the Coral Reef the sea turtles cheer', 'for every shell Pearl finds. Halfway there —', 'the sleepy sea begins to stir!'],
  ['Pearl goes Island Hopping, splashing through', 'the bright blue waves from sand to sand,', 'her little bucket filling with treasures.'],
  ['The sky glows gold for Tiki Time.', 'Drums go boom and the palm trees sway.', 'Just a few more shells to go!'],
  ['A big gentle Sea Turtle gives Pearl a ride', 'along the shimmering evening shore.', '"You’re almost there — keep going!"'],
  ['At dusk everyone does the Hula Sway.', 'The waves dance and the seashells glow.', 'The Rainbow Necklace is nearly full!'],
  ['The Sunset Limbo paints the sky pink.', 'One last beach, one last set of shells...', 'Finish to light up the whole sea!']
];
function enterStory(lv) {
  storyLevel = ((lv - 1) % TOTAL_LEVELS) + 1;
  level = storyLevel;        // so the scene behind the card uses the level's theme
  order = []; shells = [];   // no HUD / leftover shells during the story card
  stopMusic();
  state = 'story';
}

function startLevel(lv) {
  level = lv;
  if (lv === 1) score = 0;   // fresh playthrough resets the score
  order = [];
  for (var i = 0; i < 10; i++) order.push(randKind());
  collected = 0;
  hearts = 3;
  heartsLost = 0; heartsToSpawn = 0; rainbowT = 0;
  shells = [];
  sparkles = [];
  popups = [];
  distToSpawn = 420;       // a little breathing room before the first shell
  scroll = 0;
  flashTimer = 0; cheerTimer = 0;
  girl.feetY = GROUND_Y; girl.vy = 0; girl.jumping = false; girl.stumble = 0;
  // seed decorative background pebbles
  bgItems = [];
  for (var b = 0; b < 14; b++) {
    bgItems.push({ x: Math.random() * DW, y: GROUND_Y + 14 + Math.random() * 80, s: 2 + Math.random() * 4, t: Math.random() });
  }
  // scatter a bunch of decorative seashells across the beach
  decor = [];
  for (var d2 = 0; d2 < 18; d2++) decor.push(makeDecor(Math.random() * DW));
  // background palm trees, spaced across the shore
  palms = [];
  for (var pi = 0; pi < 5; pi++) {
    palms.push({ x: 120 + pi * 230 + Math.random() * 80, baseY: 378 + Math.random() * 10, scale: 0.7 + Math.random() * 0.5, ph: Math.random() * 6 });
  }
  creatures = [];
  spawnCreatureTimer = 1.2;
  bannerTimer = 2.6;       // show the level name briefly
  state = 'play';
  startMusic();
}

var CREATURE_TYPES = ['dolphin', 'whale', 'seal', 'turtle'];
function spawnCreature() {
  var type = CREATURE_TYPES[(Math.random() * CREATURE_TYPES.length) | 0];
  var seaY = 215 + Math.random() * 110;                 // higher = further out
  var scale = 0.6 + (seaY - 215) / 110 * 0.6;            // nearer ones are bigger
  var dur = type === 'dolphin' ? 1.7 : (type === 'whale' ? 3.2 : (type === 'seal' ? 2.4 : 2.8));
  creatures.push({
    type: type, x: 120 + Math.random() * (DW - 220), seaY: seaY, scale: scale,
    t: 0, dur: dur, dir: Math.random() < 0.5 ? 1 : -1, vx: (Math.random() * 14 + 6) * (Math.random() < 0.5 ? 1 : -1)
  });
}

// Jump physics: a nice high, floaty hop that's easy for little kids to time.
// (Airtime stays under the shell spacing so she still lands between shells.)
var JUMP_V = 1010, GRAV = 2300;
function doJump() {
  if (!girl.jumping) {
    girl.jumping = true;
    girl.vy = -JUMP_V;
    sJump();
  }
}

function spawnShell() {
  // crabs scuttle in among the shells from level 3 onward — jump over them!
  if (level >= 3 && Math.random() < 0.22) {
    shells.push({ type: 'crab', x: DW + 60, r: 24, handled: false, popped: 0, clickT: 0.2 + Math.random() * 0.5 });
    return;
  }
  // drop a rescue heart into the pattern after the 7th shell (if one was lost)
  if (heartsToSpawn > 0 && Math.random() < 0.6) {
    heartsToSpawn--;
    shells.push({ type: 'heart', x: DW + 60, r: 20, handled: false, popped: 0 });
    return;
  }
  var needed = order[collected];
  var kind;
  if (Math.random() < 0.45) {
    kind = needed;                 // the matching shell to collect
  } else {
    do { kind = randKind(); } while (kind === needed);  // a decoy to jump over
  }
  shells.push({ type: 'shell', x: DW + 60, kind: kind, r: 26, handled: false, popped: 0 });
}

function addSparkles(x, y, col) {
  for (var i = 0; i < 14; i++) {
    var a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 160;
    sparkles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, life: 0.6 + Math.random() * 0.4, col: col, r: 2 + Math.random() * 3 });
  }
}

// ---------------------------------------------------------------------------
// Update
// ---------------------------------------------------------------------------
function update(dt) {
  time += dt;
  // sparkles always animate
  for (var i = sparkles.length - 1; i >= 0; i--) {
    var p = sparkles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
    if (p.life <= 0) sparkles.splice(i, 1);
  }
  // floating "+10" score popups rise and fade
  for (var pi = popups.length - 1; pi >= 0; pi--) {
    var pp = popups[pi];
    pp.life -= dt; pp.y -= 34 * dt;
    if (pp.life <= 0) popups.splice(pi, 1);
  }
  if (flashTimer > 0) flashTimer -= dt;
  if (cheerTimer > 0) cheerTimer -= dt;
  if (bannerTimer > 0) bannerTimer -= dt;
  if (state === 'levelclear' || state === 'win') rainbowT = Math.min(1, rainbowT + dt * 1.2);

  // sea creatures breach the ocean (ambient — animate in every state)
  spawnCreatureTimer -= dt;
  if (spawnCreatureTimer <= 0 && creatures.length < 3) {
    spawnCreature();
    spawnCreatureTimer = 1.6 + Math.random() * 2.2;
  }
  for (var ci = creatures.length - 1; ci >= 0; ci--) {
    var cc = creatures[ci];
    cc.t += dt / cc.dur;
    cc.x += cc.vx * dt;
    if (cc.t >= 1) creatures.splice(ci, 1);
  }

  if (state !== 'play') { girl.runPhase += dt * 6; return; }

  var speed = levelSpeed(level);
  scroll += speed * dt;
  girl.runPhase += dt * (6 + speed * 0.012);

  // background parallax pebbles
  for (var b = 0; b < bgItems.length; b++) {
    var it = bgItems[b];
    it.x -= speed * 0.55 * dt;
    if (it.x < -10) { it.x = DW + Math.random() * 60; it.y = GROUND_Y + 14 + Math.random() * 80; it.s = 2 + Math.random() * 4; }
  }

  // palm trees (slow parallax)
  for (var pm = 0; pm < palms.length; pm++) {
    var pt = palms[pm];
    pt.x -= speed * 0.4 * dt;
    if (pt.x < -120) { pt.x = DW + 120 + Math.random() * 120; pt.baseY = 378 + Math.random() * 10; pt.scale = 0.7 + Math.random() * 0.5; pt.ph = Math.random() * 6; }
  }

  // decorative seashells scroll with the beach (right -> left)
  for (var di = 0; di < decor.length; di++) {
    var dc = decor[di];
    dc.x -= speed * dt;
    if (dc.x < -30) { var nd = makeDecor(DW + 20 + Math.random() * 140); dc.x = nd.x; dc.y = nd.y; dc.kind = nd.kind; dc.s = nd.s; dc.rot = nd.rot; }
  }

  // girl jump integration
  if (girl.jumping) {
    girl.vy += GRAV * dt;
    girl.feetY += girl.vy * dt;
    if (girl.feetY >= GROUND_Y) { girl.feetY = GROUND_Y; girl.vy = 0; girl.jumping = false; }
  }
  if (girl.stumble > 0) girl.stumble -= dt;
  girl.bob = girl.jumping ? 0 : Math.abs(Math.sin(girl.runPhase)) * 4;

  // spawn shells by distance so spacing feels right at every speed
  distToSpawn -= speed * dt;
  if (distToSpawn <= 0) {
    spawnShell();
    // gap measured in travel-time so a jump (~0.75s) always lands between shells
    distToSpawn = speed * (1.05 + Math.random() * 0.5);
  }

  // move + collide shells / crabs / hearts
  var girlHalf = 30;
  for (var s = shells.length - 1; s >= 0; s--) {
    var sh = shells[s];
    sh.x -= speed * dt;
    // crabs click their claws while on screen
    if (sh.type === 'crab' && sh.popped === 0) {
      sh.clickT -= dt;
      if (sh.clickT <= 0 && sh.x > -10 && sh.x < DW + 20) { sClick(); sh.clickT = 0.5 + Math.random() * 0.9; }
    }
    if (sh.popped > 0) { sh.popped += dt; if (sh.popped > 0.4) shells.splice(s, 1); continue; }

    var objTop = GROUND_Y - sh.r * 1.7;       // top of the object on the ground
    var overlap = Math.abs(sh.x - GIRL_X) < (girlHalf + sh.r * 0.8);
    if (!sh.handled && overlap) {
      var feet = girl.feetY;
      if (feet < objTop - 6) {
        // girl is above it — clearing it (a jump), so no effect
      } else {
        sh.handled = true;
        if (sh.type === 'crab') {
          hearts--; heartsLost++;
          flashTimer = 0.35; girl.stumble = 0.4;
          sPinch();
          sh.popped = 0.0001;
          if (heartsToSpawn === 0 && collected >= 7 && hearts > 0) heartsToSpawn = Math.min(heartsLost, 2);
          if (hearts <= 0) { stopMusic(); state = 'gameover'; return; }
        } else if (sh.type === 'heart') {
          if (hearts < 3) hearts++;
          addScore(0, sh.x, GROUND_Y - 56, '');
          addSparkles(sh.x, GROUND_Y - 30, '#ff5d8f');
          sHeartGain(); cheerTimer = 0.7;
          sh.popped = 0.0001;
        } else if (sh.kind === order[collected]) {
          collected++;
          addScore(10, sh.x, GROUND_Y - 56, '+10');
          addSparkles(sh.x, GROUND_Y - 30, KINDS[sh.kind].color);
          sCollect(); cheerTimer = 0.7;
          sh.popped = 0.0001;
          // after the 7th shell, send rescue hearts if any were lost
          if (collected === 7 && heartsLost > 0) heartsToSpawn = Math.min(heartsLost, 2);
          if (collected >= 10) {
            // level complete! bonus points + a rainbow
            addScore(50, DW / 2, DH / 2 - 40, '+50');
            rainbowT = 0;
            stopMusic();
            if (level >= TOTAL_LEVELS) {
              sWin();
              state = 'win';
              if (TOTAL_LEVELS + 1 > bestLevel) { bestLevel = TOTAL_LEVELS + 1; saveBest(bestLevel); }
            } else {
              sLevel();
              state = 'levelclear';
              if (level + 1 > bestLevel) { bestLevel = level + 1; saveBest(bestLevel); }
            }
            return;
          }
        } else {
          hearts--; heartsLost++;
          flashTimer = 0.35; girl.stumble = 0.4;
          sTrip();
          sh.popped = 0.0001;
          if (heartsToSpawn === 0 && collected >= 7 && hearts > 0) heartsToSpawn = Math.min(heartsLost, 2);
          if (hearts <= 0) { stopMusic(); state = 'gameover'; return; }
        }
      }
    }
    if (sh.x < -60) shells.splice(s, 1);
  }
}

// ---------------------------------------------------------------------------
// Drawing the world
// ---------------------------------------------------------------------------
// Each level has its own color scheme (sky, ocean, sand, sun).
var THEMES = [
  { skyT:'#bdeaff', skyB:'#8fd6f2', ocT:'#2aa6d6', ocB:'#3fc1e0', s1:'#ffe7b8', s2:'#f7d79a', wet:'#f5dca8', sun:'rgba(255,250,200,0.95)' },
  { skyT:'#c9f3ee', skyB:'#9fe0d2', ocT:'#1fb3a6', ocB:'#48cebf', s1:'#fdeccb', s2:'#f2d9a4', wet:'#ecd49d', sun:'rgba(255,250,210,0.95)' },
  { skyT:'#aee0ff', skyB:'#79b8ec', ocT:'#1f6fd6', ocB:'#2aa6e0', s1:'#eef0e6', s2:'#dadcc6', wet:'#e4e4cc', sun:'rgba(250,250,235,0.95)' },
  { skyT:'#ffe6c2', skyB:'#ffc98f', ocT:'#1fa6b8', ocB:'#39c2c2', s1:'#ffe0b0', s2:'#f7c98f', wet:'#f3c98f', sun:'rgba(255,225,170,0.97)' },
  { skyT:'#ffd9e6', skyB:'#ffb0cd', ocT:'#2bb3c9', ocB:'#48cfd0', s1:'#ffe2d0', s2:'#f7c9b0', wet:'#f3c9b8', sun:'rgba(255,240,220,0.95)' },
  { skyT:'#d6f5c9', skyB:'#a9e6a0', ocT:'#1fb0c9', ocB:'#41d0d0', s1:'#f3e4bf', s2:'#e3cf99', wet:'#ddc98f', sun:'rgba(255,250,210,0.95)' },
  { skyT:'#ffd1a3', skyB:'#f59e7a', ocT:'#2a6f97', ocB:'#3a8bb0', s1:'#f3d6a8', s2:'#e0b483', wet:'#d9b07f', sun:'rgba(255,205,150,0.97)' },
  { skyT:'#c9f0d8', skyB:'#8fd6ac', ocT:'#1f8f7a', ocB:'#33b89a', s1:'#e7e3bf', s2:'#cfc98f', wet:'#c9c487', sun:'rgba(245,250,225,0.95)' },
  { skyT:'#e8d0ff', skyB:'#c9a3e6', ocT:'#5a6fc9', ocB:'#6f8bd6', s1:'#f3d9c2', s2:'#e0b9a3', wet:'#d9b39f', sun:'rgba(255,225,205,0.92)' },
  { skyT:'#ffb07a', skyB:'#e0608f', ocT:'#6a4a97', ocB:'#9a5bb0', s1:'#e0c49a', s2:'#c9a87f', wet:'#c2a07a', sun:'rgba(255,200,120,0.97)' }
];
function themeFor(lv) { return THEMES[(lv - 1) % THEMES.length]; }
function levelName(lv) { return SONGS[(lv - 1) % SONGS.length].name; }

function drawBackground() {
  var TH = themeFor(level);
  // sky
  var sky = ctx.createLinearGradient(0, 0, 0, 330);
  sky.addColorStop(0, TH.skyT);
  sky.addColorStop(1, TH.skyB);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, DW, 330);

  // sun
  ctx.save();
  ctx.fillStyle = TH.sun;
  ctx.beginPath(); ctx.arc(810, 95, 46, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.28;
  ctx.beginPath(); ctx.arc(810, 95, 66, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // clouds (slow parallax)
  var cx = (-scroll * 0.06) % (DW + 400);
  drawCloud(150 + cx, 80, 1.0);
  drawCloud(520 + cx, 130, 0.7);
  drawCloud(900 + cx, 70, 0.85);
  drawCloud(150 + cx + DW + 400, 80, 1.0);
  drawCloud(520 + cx + DW + 400, 130, 0.7);

  // ocean
  var oce = ctx.createLinearGradient(0, 150, 0, 360);
  oce.addColorStop(0, TH.ocT);
  oce.addColorStop(1, TH.ocB);
  ctx.fillStyle = oce;
  ctx.fillRect(0, 150, DW, 210);

  // wave bands (medium parallax)
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 3;
  for (var w = 0; w < 5; w++) {
    var wy = 185 + w * 32;
    var ph = (scroll * 0.25 + w * 40) % 80;
    ctx.beginPath();
    for (var x = -80; x <= DW + 80; x += 40) {
      var yy = wy + Math.sin((x + ph) * 0.05 + time + w) * 5;
      if (x === -80) ctx.moveTo(x, yy); else ctx.quadraticCurveTo(x - 20, yy + 6, x, yy);
    }
    ctx.globalAlpha = 0.5 - w * 0.06;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // wet sand strip with foam edge
  var foamY = 352 + Math.sin(time * 1.5) * 3;
  ctx.fillStyle = TH.s1;
  ctx.fillRect(0, 350, DW, DH - 350);
  ctx.fillStyle = TH.wet;
  ctx.fillRect(0, 350, DW, 26);
  // foam
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.moveTo(0, foamY);
  for (var fx = 0; fx <= DW; fx += 36) {
    ctx.quadraticCurveTo(fx + 9, foamY - 9 + Math.sin(fx * 0.08 + time * 2) * 4, fx + 18, foamY);
    ctx.quadraticCurveTo(fx + 27, foamY + 9, fx + 36, foamY);
  }
  ctx.lineTo(DW, 348); ctx.lineTo(0, 348); ctx.closePath(); ctx.fill();

  // dry beach sand
  var sand = ctx.createLinearGradient(0, 376, 0, DH);
  sand.addColorStop(0, TH.s1);
  sand.addColorStop(1, TH.s2);
  ctx.fillStyle = sand;
  ctx.fillRect(0, 376, DW, DH - 376);

  // sand speckles (scrolling, so the ground reads as moving)
  ctx.fillStyle = 'rgba(150,120,90,0.32)';
  for (var d = 0; d < 60; d++) {
    var sx = ((d * 137.5 - scroll * 1.0) % (DW + 40) + DW + 40) % (DW + 40) - 20;
    var sy = 392 + ((d * 53) % (DH - 396));
    ctx.fillRect(sx, sy, 3, 3);
  }

  // decorative pebbles / tiny starfish
  for (var b = 0; b < bgItems.length; b++) {
    var it = bgItems[b];
    ctx.fillStyle = it.t > 0.7 ? 'rgba(255,160,120,0.8)' : 'rgba(150,120,90,0.5)';
    ctx.beginPath(); ctx.arc(it.x, it.y, it.s, 0, Math.PI * 2); ctx.fill();
  }
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.arc(28, 6, 22, 0, Math.PI * 2);
  ctx.arc(-26, 8, 20, 0, Math.PI * 2);
  ctx.arc(6, -16, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ---- background palm trees ----
function drawPalms() {
  for (var i = 0; i < palms.length; i++) {
    var p = palms[i];
    ctx.save();
    ctx.translate(p.x, p.baseY);
    ctx.scale(p.scale, p.scale);
    var sway = Math.sin(time * 1.3 + p.ph) * 0.12;
    ctx.rotate(sway * 0.15);
    // trunk (curved, tapered)
    ctx.strokeStyle = '#9c6b3f'; ctx.lineCap = 'round';
    ctx.lineWidth = 13;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-10, -70, 6, -150); ctx.stroke();
    ctx.strokeStyle = '#7d5230'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-2, -10); ctx.quadraticCurveTo(-12, -70, 4, -148); ctx.stroke();
    var topX = 6, topY = -150;
    // coconuts
    ctx.fillStyle = '#5b3a26';
    ctx.beginPath(); ctx.arc(topX - 5, topY + 4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(topX + 5, topY + 6, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(topX + 1, topY + 11, 5, 0, Math.PI * 2); ctx.fill();
    // fronds
    var fronds = 7;
    for (var f = 0; f < fronds; f++) {
      var a = (-Math.PI * 0.92) + (f / (fronds - 1)) * (Math.PI * 0.84);
      var droop = sway * 6;
      var ex = topX + Math.cos(a) * 62, ey = topY + Math.sin(a) * 46 + 18 + droop;
      var mx = topX + Math.cos(a) * 34, my = topY + Math.sin(a) * 24 - 6;
      ctx.strokeStyle = (f % 2 === 0) ? '#2f9e4f' : '#37b85c';
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(topX, topY + 2); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
      ctx.lineWidth = 2.5; ctx.strokeStyle = '#1f7d3a';
      ctx.beginPath(); ctx.moveTo(topX, topY + 2); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
    }
    ctx.restore();
  }
}

// ---- cute sea creatures breaching the ocean ----
function drawSplash(x, y, r) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  for (var i = -2; i <= 2; i++) {
    ctx.beginPath(); ctx.arc(x + i * r * 0.5, y - Math.abs(i) * 2 - 3, r * 0.16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawCreatures() {
  for (var i = 0; i < creatures.length; i++) {
    var c = creatures[i];
    var tt = Math.min(1, Math.max(0, c.t));
    var rise = Math.sin(tt * Math.PI);
    ctx.save();
    if (tt < 0.16 || tt > 0.84) drawSplash(c.x, c.seaY + 2, 12 * c.scale);
    if (c.type === 'dolphin') {
      var peak = 78 * c.scale;
      var y = c.seaY - rise * peak;
      var ang = Math.cos(tt * Math.PI) * 0.95 * c.dir;   // nose-up then dive
      ctx.translate(c.x, y); ctx.scale(c.dir * c.scale, c.scale); ctx.rotate(-ang);
      drawDolphin();
    } else if (c.type === 'whale') {
      var y2 = c.seaY - rise * 30 * c.scale;
      ctx.translate(c.x, y2); ctx.scale(c.dir * c.scale, c.scale);
      drawWhale(tt);
    } else if (c.type === 'seal') {
      var y3 = c.seaY - rise * 40 * c.scale;
      ctx.translate(c.x, y3); ctx.scale(c.scale, c.scale);
      drawSeal();
    } else { // turtle
      var y4 = c.seaY - rise * 30 * c.scale;
      ctx.translate(c.x, y4); ctx.scale(c.dir * c.scale, c.scale);
      ctx.rotate(Math.cos(tt * Math.PI) * 0.2 * c.dir);
      drawTurtle();
    }
    ctx.restore();
  }
}
function eyeSmile(ex, ey) {
  ctx.fillStyle = '#22303a';
  ctx.beginPath(); ctx.arc(ex, ey, 2.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex - 0.8, ey - 0.8, 0.9, 0, Math.PI * 2); ctx.fill();
}
function drawDolphin() {
  ctx.fillStyle = '#7fb5cf'; ctx.strokeStyle = '#4f8aa6'; ctx.lineWidth = 2;
  // body (comma shape)
  ctx.beginPath();
  ctx.moveTo(-34, 4);
  ctx.quadraticCurveTo(-6, -26, 30, -14);
  ctx.quadraticCurveTo(12, -6, 16, 6);
  ctx.quadraticCurveTo(-6, 0, -34, 16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // dorsal fin
  ctx.beginPath(); ctx.moveTo(-2, -16); ctx.quadraticCurveTo(6, -30, 14, -16); ctx.closePath(); ctx.fill();
  // tail fluke
  ctx.beginPath(); ctx.moveTo(-34, 4); ctx.quadraticCurveTo(-46, -2, -44, -12);
  ctx.quadraticCurveTo(-36, -6, -30, 2); ctx.quadraticCurveTo(-40, 12, -44, 18);
  ctx.quadraticCurveTo(-36, 16, -34, 16); ctx.closePath(); ctx.fill();
  // belly
  ctx.fillStyle = '#e8f4fa';
  ctx.beginPath(); ctx.moveTo(2, 6); ctx.quadraticCurveTo(16, 2, 24, -6); ctx.quadraticCurveTo(16, 10, 2, 10); ctx.closePath(); ctx.fill();
  // snout smile + eye
  ctx.strokeStyle = '#4f8aa6'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(22, -6, 5, 0.1, 1.1); ctx.stroke();
  eyeSmile(20, -12);
}
function drawWhale(tt) {
  // spout
  if (tt > 0.35 && tt < 0.7) {
    ctx.save(); ctx.fillStyle = 'rgba(200,235,255,0.85)';
    for (var s = 0; s < 5; s++) {
      var sy = -34 - s * 7;
      ctx.beginPath(); ctx.arc((s - 2) * 3, sy, 3.2 - s * 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.fillStyle = '#5f86c9'; ctx.strokeStyle = '#3f5fa6'; ctx.lineWidth = 2;
  // big rounded body
  ctx.beginPath(); ctx.ellipse(0, 0, 38, 22, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // tail fluke
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.quadraticCurveTo(-52, -10, -56, -20);
  ctx.quadraticCurveTo(-44, -12, -36, -6); ctx.quadraticCurveTo(-48, 0, -54, 8);
  ctx.quadraticCurveTo(-44, 6, -34, 6); ctx.closePath(); ctx.fill();
  // belly
  ctx.fillStyle = '#dfeafc';
  ctx.beginPath(); ctx.ellipse(6, 10, 26, 10, 0, 0, Math.PI); ctx.fill();
  // eye + smile
  eyeSmile(20, -4);
  ctx.strokeStyle = '#3f5fa6'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.arc(22, 2, 7, 0.05, 1.0); ctx.stroke();
}
function drawSeal() {
  ctx.fillStyle = '#9aa7b2'; ctx.strokeStyle = '#6f7d88'; ctx.lineWidth = 2;
  // shoulders
  ctx.beginPath(); ctx.ellipse(0, 18, 24, 16, 0, 0, Math.PI * 2); ctx.fill();
  // flippers
  ctx.beginPath(); ctx.ellipse(-16, 24, 7, 4, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, 24, 7, 4, -0.5, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(0, -2, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // snout
  ctx.fillStyle = '#c2ccd4';
  ctx.beginPath(); ctx.ellipse(0, 4, 8, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a4750';
  ctx.beginPath(); ctx.arc(0, 2, 2, 0, Math.PI * 2); ctx.fill();
  // eyes
  eyeSmile(-6, -4); eyeSmile(6, -4);
  // whiskers
  ctx.strokeStyle = '#6f7d88'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-3, 5); ctx.lineTo(-12, 4); ctx.moveTo(-3, 7); ctx.lineTo(-12, 8);
  ctx.moveTo(3, 5); ctx.lineTo(12, 4); ctx.moveTo(3, 7); ctx.lineTo(12, 8); ctx.stroke();
}
function drawTurtle() {
  // flippers
  ctx.fillStyle = '#4fae84';
  ctx.beginPath(); ctx.ellipse(14, 10, 10, 5, -0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-16, 10, 9, 5, 0.5, 0, Math.PI * 2); ctx.fill();
  // head
  ctx.fillStyle = '#5fbf92';
  ctx.beginPath(); ctx.arc(22, -2, 8, 0, Math.PI * 2); ctx.fill();
  eyeSmile(24, -4);
  // shell
  ctx.fillStyle = '#3f8f5f'; ctx.strokeStyle = '#2f6f47'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // shell pattern
  ctx.fillStyle = '#6fc98f';
  ctx.beginPath(); ctx.arc(0, -2, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-11, 2, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 2, 4, 0, Math.PI * 2); ctx.fill();
}

function drawDecorShells() {
  for (var i = 0; i < decor.length; i++) {
    var d = decor[i];
    // half-buried shell
    ctx.save();
    ctx.globalAlpha = 0.6;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    drawShell(ctx, d.kind, 0, 0, d.s);
    ctx.restore();
    // little sand mound over the base so it reads as resting in the sand
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = '#f1d090';
    ctx.beginPath();
    ctx.ellipse(d.x, d.y + d.s * 0.55, d.s * 1.15, d.s * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawShellsOnGround() {
  for (var s = 0; s < shells.length; s++) {
    var sh = shells[s];
    var pop = sh.popped > 0 ? 1 + sh.popped * 2 : 1;
    var alpha = sh.popped > 0 ? Math.max(0, 1 - sh.popped * 2.5) : 1;
    // shadow
    ctx.save();
    ctx.globalAlpha = 0.18 * alpha;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(sh.x, GROUND_Y + 6, sh.r * 0.95, sh.r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    var bounce = Math.sin(time * 4 + sh.x * 0.05) * 2;
    ctx.save();
    ctx.globalAlpha = alpha;
    if (sh.type === 'crab') {
      drawCrab(sh.x, GROUND_Y - sh.r * 0.7, sh.r * pop);
    } else if (sh.type === 'heart') {
      var hb = GROUND_Y - sh.r * 1.3 - bounce - Math.abs(Math.sin(time * 3)) * 4;
      ctx.fillStyle = '#ff5d8f';
      drawHeart(sh.x, hb, sh.r * 0.9 * pop);
      ctx.globalAlpha = alpha * 0.5;
      ctx.fillStyle = '#fff';
      drawHeart(sh.x - sh.r * 0.18, hb - sh.r * 0.18, sh.r * 0.3 * pop);
    } else {
      drawShell(ctx, sh.kind, sh.x, GROUND_Y - sh.r * 0.9 - bounce, sh.r * pop);
    }
    ctx.restore();
  }
}

// a cute scuttling crab (obstacle) — claws click open and shut
function drawCrab(cx, cy, r) {
  var claw = Math.abs(Math.sin(time * 11 + cx * 0.05));   // 0..1 claw open
  ctx.save();
  ctx.translate(cx, cy);
  var body = '#ff6b4a', bodyDk = '#e0512f', shine = '#ff9277';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // legs (3 each side, jittering)
  ctx.strokeStyle = bodyDk; ctx.lineWidth = r * 0.12;
  for (var i = 0; i < 3; i++) {
    var ly = -r * 0.1 + i * r * 0.28;
    var kick = Math.sin(time * 12 + i) * r * 0.06;
    ctx.beginPath(); ctx.moveTo(-r * 0.6, ly); ctx.lineTo(-r * 1.15, ly + r * 0.18 + kick); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.6, ly); ctx.lineTo(r * 1.15, ly + r * 0.18 - kick); ctx.stroke();
  }
  // claws on little arms
  for (var sgn = -1; sgn <= 1; sgn += 2) {
    var ax = sgn * r * 0.85, ay = -r * 0.5;
    ctx.strokeStyle = bodyDk; ctx.lineWidth = r * 0.14;
    ctx.beginPath(); ctx.moveTo(sgn * r * 0.5, -r * 0.2); ctx.lineTo(ax, ay); ctx.stroke();
    ctx.fillStyle = body; ctx.strokeStyle = bodyDk; ctx.lineWidth = r * 0.06;
    // lower pincer
    ctx.beginPath(); ctx.ellipse(ax, ay, r * 0.26, r * 0.16, sgn * 0.5, 0, Math.PI * 2); ctx.fill();
    // upper pincer opens/closes
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(-sgn * (0.2 + claw * 0.6));
    ctx.beginPath(); ctx.ellipse(0, -r * 0.12, r * 0.22, r * 0.11, sgn * 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // body shell
  ctx.fillStyle = body; ctx.strokeStyle = bodyDk; ctx.lineWidth = r * 0.08;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.7, r * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shine;
  ctx.beginPath(); ctx.ellipse(-r * 0.2, -r * 0.18, r * 0.2, r * 0.12, -0.4, 0, Math.PI * 2); ctx.fill();
  // eyes on stalks
  ctx.strokeStyle = bodyDk; ctx.lineWidth = r * 0.08;
  ctx.beginPath(); ctx.moveTo(-r * 0.2, -r * 0.4); ctx.lineTo(-r * 0.24, -r * 0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(r * 0.2, -r * 0.4); ctx.lineTo(r * 0.24, -r * 0.7); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r * 0.24, -r * 0.78, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.24, -r * 0.78, r * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a1a14';
  ctx.beginPath(); ctx.arc(-r * 0.24, -r * 0.78, r * 0.06, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.24, -r * 0.78, r * 0.06, 0, Math.PI * 2); ctx.fill();
  // smile
  ctx.strokeStyle = bodyDk; ctx.lineWidth = r * 0.06;
  ctx.beginPath(); ctx.arc(0, -r * 0.05, r * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// The little girl with brown hair and bubble braids
// ---------------------------------------------------------------------------
function drawGirl() {
  var x = GIRL_X;
  var feet = girl.feetY - girl.bob;
  var run = girl.runPhase;
  var inAir = girl.jumping;
  var legSwing  = inAir ?  0.55 : Math.sin(run) * 0.6;            // front leg
  var legSwing2 = inAir ? -0.45 : Math.sin(run + Math.PI) * 0.6;  // back leg
  // arms swing opposite their same-side leg for a natural gait;
  // on a jump the front (right) arm reaches forward, the back arm swings back
  var armSwing  = inAir ? -1.0  : Math.sin(run) * 0.5;            // back arm  (opposite back leg)
  var armSwing2 = inAir ?  1.2  : Math.sin(run + Math.PI) * 0.5;  // front arm (opposite front leg)

  // palette
  var skin = '#ffdcb8', skinDk = '#f0b98a';
  var hair = '#7a4a26', hairLt = '#9c6438';
  var dress = '#ff7aa8', dressDk = '#e85f8e';
  var OUT = '#5a3a28';                 // soft dark cartoon outline

  ctx.save();
  ctx.translate(x, feet);
  if (girl.stumble > 0) ctx.rotate(Math.sin(girl.stumble * 40) * 0.06);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // chibi proportions: big head, little body (feet at y=0, growing upward)
  var hipY = -44, shoulderY = -80, headY = -116, headR = 30;

  // ground shadow
  ctx.save();
  ctx.globalAlpha = 0.16; ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 2, 28, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // --- helpers -------------------------------------------------------------
  function limb(x1, y1, x2, y2, w, col) {            // outlined rounded limb
    ctx.strokeStyle = OUT; ctx.lineWidth = w + 3.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  function shoe(fx, fy) {
    ctx.fillStyle = OUT;
    ctx.beginPath(); ctx.ellipse(fx + 2, fy + 1, 9.5, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff4f87';
    ctx.beginPath(); ctx.ellipse(fx + 2, fy, 7.5, 4.8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(fx + 2, fy - 1, 1.7, 0, Math.PI * 2); ctx.fill();
  }
  function leg(swing, col) {
    var fx = Math.sin(swing) * 13;
    var lift = inAir ? (swing < 0 ? 12 : 3) : Math.max(0, Math.cos(swing)) * 7;
    var fy = -3 - lift;
    limb(Math.sin(swing) * 3, hipY + 6, fx, fy, 12, col);
    shoe(fx, fy);
  }

  // ---- back arm + back leg ----
  var bax = Math.sin(armSwing) * 16, bay = shoulderY + 30 + Math.cos(armSwing) * 7;
  limb(-4, shoulderY + 10, bax - 4, bay, 10, skinDk);
  leg(legSwing2, skinDk);

  // ---- dress (bell shape) ----
  ctx.fillStyle = dress; ctx.strokeStyle = OUT; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-13, shoulderY + 4);
  ctx.lineTo(13, shoulderY + 4);
  ctx.quadraticCurveTo(22, hipY - 6, 30, hipY + 14);
  ctx.quadraticCurveTo(0, hipY + 26, -30, hipY + 14);
  ctx.quadraticCurveTo(-22, hipY - 6, -13, shoulderY + 4);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  // hem shadow
  ctx.fillStyle = dressDk;
  ctx.beginPath();
  ctx.moveTo(-30, hipY + 14);
  ctx.quadraticCurveTo(0, hipY + 26, 30, hipY + 14);
  ctx.quadraticCurveTo(0, hipY + 19, -30, hipY + 14);
  ctx.closePath(); ctx.fill();
  // polka dots
  ctx.fillStyle = '#ffd1e2';
  ctx.beginPath(); ctx.arc(-9, shoulderY + 26, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, shoulderY + 36, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-3, hipY + 4, 3, 0, Math.PI * 2); ctx.fill();
  // little collar
  ctx.fillStyle = '#fff'; ctx.strokeStyle = OUT; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, shoulderY + 4, 11, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // ---- front leg ----
  leg(legSwing, skin);

  // ---- front arm + sand pail ----
  var hx = Math.sin(armSwing2) * 17, hy = shoulderY + 30 + Math.cos(armSwing2) * 7;
  limb(4, shoulderY + 10, hx + 4, hy, 10, skin);
  ctx.save();
  ctx.translate(hx + 6, hy + 7);
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(10, -8); ctx.lineTo(8, 9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5d5d';
  ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(8, -6); ctx.lineTo(6.5, 8); ctx.lineTo(-6.5, 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ffb3b3'; ctx.fillRect(-8, -6, 16, 3);
  ctx.strokeStyle = '#ffd93d'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, -6, 9, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  ctx.restore();

  // ---- neck ----
  limb(0, shoulderY + 6, 0, headY + headR - 6, 9, skin);

  // ---- bubble braids (behind head) ----
  function braid(side) {
    var bob = Math.sin(run * 2 + (side > 0 ? 0 : 1)) * 2;   // playful bounce
    var bx = side * (headR - 6), by = headY + 8;
    var sizes = [10, 9, 8, 7];
    var yy = by;
    for (var i = 0; i < sizes.length; i++) {
      yy += sizes[i] + (i === 0 ? 1 : 5);
      var cxv = bx + side * (5 + i * 4), cyv = yy + bob * (i + 1) * 0.5;
      ctx.fillStyle = OUT;
      ctx.beginPath(); ctx.arc(cxv, cyv, sizes[i] + 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = hair;
      ctx.beginPath(); ctx.arc(cxv, cyv, sizes[i], 0, Math.PI * 2); ctx.fill();
      // shine
      ctx.fillStyle = hairLt;
      ctx.beginPath(); ctx.arc(cxv - sizes[i] * 0.3, cyv - sizes[i] * 0.35, sizes[i] * 0.3, 0, Math.PI * 2); ctx.fill();
      // colorful hair tie above each bubble
      ctx.fillStyle = (i % 2 === 0) ? '#ffd93d' : '#3ec9c9';
      ctx.beginPath(); ctx.ellipse(cxv - side * 1, cyv - sizes[i] - 1, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }
  braid(-1); braid(1);

  // ---- head ----
  ctx.fillStyle = OUT;
  ctx.beginPath(); ctx.arc(0, headY, headR + 2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI * 2); ctx.fill();

  // ---- hair: rounded top + scalloped bangs framing the face ----
  ctx.fillStyle = hair;
  ctx.beginPath();
  // crown
  ctx.arc(0, headY, headR + 0.5, Math.PI * 1.02, Math.PI * 2.02, false);
  // scalloped fringe across the forehead
  var bangs = 5, bw = (headR * 1.9) / bangs, startX = -headR * 0.95;
  for (var bI = 0; bI <= bangs; bI++) {
    var bxp = startX + bI * bw;
    ctx.quadraticCurveTo(bxp - bw * 0.25, headY - headR * 0.18, bxp, headY - headR * 0.42);
    ctx.quadraticCurveTo(bxp + bw * 0.25, headY - headR * 0.18, bxp + bw * 0.5, headY - headR * 0.1);
  }
  ctx.closePath(); ctx.fill();
  // side hair tufts hugging the cheeks
  ctx.fillStyle = hair;
  ctx.beginPath(); ctx.ellipse(-headR * 0.92, headY + 2, 7, 16, 0.25, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(headR * 0.92, headY + 2, 7, 16, -0.25, 0, Math.PI * 2); ctx.fill();
  // hair shine on crown
  ctx.fillStyle = hairLt;
  ctx.beginPath(); ctx.ellipse(-8, headY - headR * 0.55, 7, 4, -0.5, 0, Math.PI * 2); ctx.fill();

  // cute bow on top
  (function () {
    var byp = headY - headR + 2;
    ctx.fillStyle = OUT; ctx.lineWidth = 0;
    ctx.fillStyle = '#ff5d8f';
    ctx.beginPath(); ctx.moveTo(0, byp); ctx.quadraticCurveTo(-16, byp - 9, -15, byp + 2); ctx.quadraticCurveTo(-16, byp + 11, 0, byp + 2); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, byp); ctx.quadraticCurveTo(16, byp - 9, 15, byp + 2); ctx.quadraticCurveTo(16, byp + 11, 0, byp + 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd93d';
    ctx.beginPath(); ctx.arc(0, byp + 1, 3.2, 0, Math.PI * 2); ctx.fill();
  })();

  // ---- face ----
  var eyeY = headY + 4, eyeDX = 11;
  // big sparkly eyes
  for (var s = -1; s <= 1; s += 2) {
    var ex = s * eyeDX;
    // white
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex, eyeY, 6, 8.5, 0, 0, Math.PI * 2); ctx.fill();
    // iris
    ctx.fillStyle = '#5b3a26';
    ctx.beginPath(); ctx.arc(ex, eyeY + 1, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2418';
    ctx.beginPath(); ctx.arc(ex, eyeY + 1, 3, 0, Math.PI * 2); ctx.fill();
    // big highlight + little sparkle
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex - 1.8, eyeY - 1.5, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + 2, eyeY + 2.5, 1, 0, Math.PI * 2); ctx.fill();
    // upper lash
    ctx.strokeStyle = OUT; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ex, eyeY, 6.5, Math.PI * 1.15, Math.PI * 1.95); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex + s * 6, eyeY - 4); ctx.lineTo(ex + s * 9, eyeY - 6); ctx.stroke();
  }
  // rosy cheeks
  ctx.fillStyle = 'rgba(255,140,165,0.7)';
  ctx.beginPath(); ctx.arc(-15, eyeY + 11, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, eyeY + 11, 4.5, 0, Math.PI * 2); ctx.fill();
  // little nose
  ctx.fillStyle = skinDk;
  ctx.beginPath(); ctx.arc(0, eyeY + 7, 1.4, 0, Math.PI * 2); ctx.fill();
  // happy open smile
  ctx.fillStyle = '#a8412f'; ctx.strokeStyle = '#a8412f'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-6, eyeY + 12);
  ctx.quadraticCurveTo(0, eyeY + 19, 6, eyeY + 12);
  ctx.quadraticCurveTo(0, eyeY + 16, -6, eyeY + 12);
  ctx.closePath(); ctx.fill();
  // tongue
  ctx.fillStyle = '#ff8f9e';
  ctx.beginPath(); ctx.arc(0, eyeY + 14, 2.4, 0, Math.PI); ctx.fill();

  // happy bounce hearts when collecting
  if (cheerTimer > 0) {
    ctx.fillStyle = 'rgba(255,90,140,' + Math.min(1, cheerTimer * 2) + ')';
    var hyf = headY - headR - 16 - (0.7 - cheerTimer) * 28;
    drawHeart(20, hyf, 7);
    drawHeart(-22, hyf + 7, 6);
  }

  ctx.restore();
}

function drawHeart(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s / 6, s / 6);
  ctx.beginPath();
  ctx.moveTo(0, 3);
  ctx.bezierCurveTo(-1, 0, -6, 0, -6, -3.5);
  ctx.bezierCurveTo(-6, -6, -3, -7, 0, -4);
  ctx.bezierCurveTo(3, -7, 6, -6, 6, -3.5);
  ctx.bezierCurveTo(6, 0, 1, 0, 0, 3);
  ctx.fill();
  ctx.restore();
}

// Big level-name banner shown for a moment at the start of each level.
function drawBanner() {
  var a = Math.min(1, bannerTimer, (2.6 - bannerTimer) * 3);   // fade in then out
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#2a6f97';
  ctx.font = 'bold 26px "Comic Sans MS", sans-serif';
  ctx.fillText('Level ' + level, DW / 2, 150);
  ctx.font = 'bold 60px "Comic Sans MS", sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = '#ffffff';
  ctx.strokeText(levelName(level), DW / 2, 200);
  ctx.fillStyle = '#ffd93d';
  ctx.fillText(levelName(level), DW / 2, 200);
  ctx.restore();
}

// ---------------------------------------------------------------------------
// HUD — the order of 10 shells across the top
// ---------------------------------------------------------------------------
function drawHUD() {
  if (order.length < 10) return;   // nothing to show until a level has started
  // level pill (top-left) with the level's name
  roundRect(16, 14, 210, 40, 20, 'rgba(255,255,255,0.85)');
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff7aa8';
  ctx.font = 'bold 16px "Comic Sans MS", sans-serif';
  ctx.fillText('L' + level, 30, 35);
  ctx.fillStyle = '#2a6f97';
  ctx.font = 'bold 19px "Comic Sans MS", sans-serif';
  ctx.fillText(levelName(level), 64, 35);

  // score pill (below the level pill) with a little star
  roundRect(16, 60, 150, 38, 19, 'rgba(255,255,255,0.85)');
  ctx.fillStyle = '#ffd93d';
  drawStar(36, 79, 11);
  ctx.fillStyle = '#2a6f97';
  ctx.font = 'bold 21px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(String(score), 54, 80);

  // hearts (top-right)
  ctx.fillStyle = '#ff4d7d';
  for (var h = 0; h < 3; h++) {
    ctx.save();
    ctx.globalAlpha = h < hearts ? 1 : 0.25;
    drawHeart(DW - 36 - h * 34, 34, 12);
    ctx.restore();
  }

  // order panel (top-center)
  var n = 10, chip = 42, gap = 6;
  var panelW = n * chip + (n - 1) * gap + 24;
  var px = (DW - panelW) / 2, py = 10;
  roundRect(px, py, panelW, chip + 22, 16, 'rgba(255,255,255,0.85)');
  for (var i = 0; i < n; i++) {
    var cxp = px + 12 + i * (chip + gap) + chip / 2;
    var cyp = py + 12 + chip / 2;
    var isDone = i < collected;
    var isNext = i === collected;
    // chip background
    ctx.save();
    if (isNext) {
      var glow = 0.5 + Math.sin(time * 6) * 0.5;
      ctx.shadowColor = 'rgba(255,210,60,' + (0.6 + glow * 0.4) + ')';
      ctx.shadowBlur = 16;
    }
    roundRect(cxp - chip / 2, cyp - chip / 2, chip, chip, 10,
      isNext ? '#fff6d6' : (isDone ? '#dfeee0' : '#f3f0ea'));
    ctx.restore();
    // shell
    ctx.save();
    ctx.globalAlpha = isDone ? 0.45 : 1;
    drawShell(ctx, order[i], cxp, cyp, 14);
    ctx.restore();
    if (isDone) {
      // green check
      ctx.strokeStyle = '#3bb24a'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cxp - 7, cyp + 1); ctx.lineTo(cxp - 2, cyp + 7); ctx.lineTo(cxp + 8, cyp - 7);
      ctx.stroke();
    }
    if (isNext) {
      // bouncing arrow above
      var ay = py + chip + 16 + Math.sin(time * 6) * 3;
      ctx.fillStyle = '#ff8c00';
      ctx.beginPath();
      ctx.moveTo(cxp, ay + 8); ctx.lineTo(cxp - 7, ay); ctx.lineTo(cxp + 7, ay);
      ctx.closePath(); ctx.fill();
    }
  }
}

function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}

function drawSparkles() {
  for (var i = 0; i < sparkles.length; i++) {
    var p = sparkles[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.col;
    drawStar(p.x, p.y, p.r * 1.6);
    ctx.restore();
  }
}
function drawPopups() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (var i = 0; i < popups.length; i++) {
    var p = popups[i];
    var big = p.text.length > 3;
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
    ctx.font = 'bold ' + (big ? 40 : 26) + 'px "Comic Sans MS", sans-serif';
    ctx.lineWidth = big ? 6 : 4; ctx.strokeStyle = '#2a6f97';
    ctx.fillStyle = '#ffd93d';
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  }
}
function drawStar(x, y, r) {
  ctx.beginPath();
  for (var p = 0; p < 10; p++) {
    var a = -Math.PI / 2 + p * Math.PI / 5;
    var rad = (p % 2 === 0) ? r : r * 0.45;
    var xx = x + Math.cos(a) * rad, yy = y + Math.sin(a) * rad;
    if (p === 0) ctx.moveTo(xx, yy); else ctx.lineTo(xx, yy);
  }
  ctx.closePath(); ctx.fill();
}

// ---------------------------------------------------------------------------
// Overlays (menu / level clear / game over / win)
// ---------------------------------------------------------------------------
function drawCenterPanel(w, h) {
  var x = (DW - w) / 2, y = (DH - h) / 2;
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 8;
  roundRect(x, y, w, h, 28, 'rgba(255,255,255,0.95)');
  ctx.restore();
  return { x: x, y: y };
}

function drawButton(label) {
  var bh = 64, by = DH / 2 + 110;
  ctx.font = 'bold 28px "Comic Sans MS", sans-serif';
  var bw = Math.max(240, ctx.measureText(label).width + 64);   // widen to fit the label
  var bx = (DW - bw) / 2;
  var pulse = 1 + Math.sin(time * 4) * 0.03;
  ctx.save();
  ctx.translate(DW / 2, by + bh / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-DW / 2, -(by + bh / 2));
  roundRect(bx, by, bw, bh, 32, '#ff6aa0');
  roundRect(bx, by, bw, bh - 6, 30, '#ff86b3');
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px "Comic Sans MS", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, DW / 2, by + bh / 2);
  ctx.restore();
  return { x: bx, y: by, w: bw, h: bh };
}

function drawTitle() {
  ctx.save();
  ctx.textAlign = 'center';
  var ty = DH / 2 - 120 + Math.sin(time * 2) * 4;
  // decorative shells around title
  drawShell(ctx, 0, DW / 2 - 200, ty + 10, 26);
  drawShell(ctx, 3, DW / 2 + 200, ty + 6, 26);
  ctx.font = 'bold 58px "Comic Sans MS", sans-serif';
  ctx.lineWidth = 8; ctx.strokeStyle = '#2a6f97';
  ctx.fillStyle = '#ffd93d';
  ctx.strokeText('Seashell', DW / 2, ty);
  ctx.fillText('Seashell', DW / 2, ty);
  ctx.font = 'bold 58px "Comic Sans MS", sans-serif';
  ctx.fillStyle = '#ff7aa8';
  ctx.strokeText('Shore Dash', DW / 2, ty + 64);
  ctx.fillText('Shore Dash', DW / 2, ty + 64);
  ctx.restore();
}

function drawRainbow() {
  var p = rainbowT;                     // 0..1 sweep progress
  if (p <= 0) return;
  var cx = DW / 2, cy = 660, R = 600, w = 15;
  var cols = ['#ff5d5d', '#ff9f43', '#ffd93d', '#5fd16a', '#4fb0e0', '#5a6fd6', '#a55eea'];
  ctx.save();
  ctx.lineCap = 'round';
  var end = Math.PI + p * Math.PI;      // sweep from the left across to the right
  // soft white halo under the bands
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = w * 7.4;
  ctx.beginPath(); ctx.arc(cx, cy, R - w * 3.5, Math.PI, end); ctx.stroke();
  ctx.globalAlpha = 0.9;
  for (var i = 0; i < cols.length; i++) {
    ctx.strokeStyle = cols[i];
    ctx.lineWidth = w + 1;
    ctx.beginPath(); ctx.arc(cx, cy, R - i * w, Math.PI, end); ctx.stroke();
  }
  ctx.restore();
}

function drawOverlay() {
  // dim
  ctx.fillStyle = 'rgba(40,90,120,0.35)';
  ctx.fillRect(0, 0, DW, DH);
  if (state === 'levelclear' || state === 'win') drawRainbow();

  if (state === 'menu') {
    drawTitle();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#2a6f97';
    ctx.font = '22px "Comic Sans MS", sans-serif';
    ctx.fillText('Run into the matching shell to collect it.', DW / 2, DH / 2 + 6);
    ctx.fillText('Tap / Space to JUMP over the others!', DW / 2, DH / 2 + 38);
    if (bestLevel > 1 || bestScore > 0) {
      ctx.fillStyle = '#ff7aa8';
      ctx.font = 'bold 20px "Comic Sans MS", sans-serif';
      ctx.fillText('Best:  Level ' + Math.min(TOTAL_LEVELS, bestLevel) + '   ·   Score ' + bestScore, DW / 2, DH / 2 + 72);
    }
    drawButton('Play!');
  } else if (state === 'story') {
    var pst = drawCenterPanel(840, 450);
    ctx.textAlign = 'center';
    // chapter heading
    ctx.fillStyle = '#2a6f97';
    ctx.font = 'bold 26px "Comic Sans MS", sans-serif';
    ctx.fillText('Level ' + storyLevel, DW / 2, pst.y + 56);
    ctx.fillStyle = '#ff7aa8';
    ctx.font = 'bold 46px "Comic Sans MS", sans-serif';
    ctx.fillText(levelName(storyLevel), DW / 2, pst.y + 106);
    // flanking shells
    drawShell(ctx, (storyLevel * 2) % KINDS.length, DW / 2 - 230, pst.y + 96, 22);
    drawShell(ctx, (storyLevel * 5 + 1) % KINDS.length, DW / 2 + 230, pst.y + 96, 22);
    // story lines
    ctx.fillStyle = '#34525f';
    ctx.font = 'bold 28px "Comic Sans MS", sans-serif';
    var lines = STORY[storyLevel - 1];
    for (var li = 0; li < lines.length; li++) ctx.fillText(lines[li], DW / 2, pst.y + 162 + li * 40);
    drawButton(storyLevel === 1 ? "Pearl's Adventure!" : 'Start!');
  } else if (state === 'levelclear') {
    var p = drawCenterPanel(520, 360);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 44px "Comic Sans MS", sans-serif';
    ctx.strokeStyle = '#2a6f97'; ctx.lineWidth = 6;
    ctx.strokeText('Great job!', DW / 2, p.y + 70);
    ctx.fillText('Great job!', DW / 2, p.y + 70);
    // stars
    ctx.fillStyle = '#ffd93d';
    for (var i = 0; i < 3; i++) { drawStar(DW / 2 - 60 + i * 60, p.y + 124 + Math.sin(time * 4 + i) * 4, 22); }
    ctx.fillStyle = '#2a6f97';
    ctx.font = '24px "Comic Sans MS", sans-serif';
    ctx.fillText(levelName(level) + ' complete!', DW / 2, p.y + 178);
    ctx.font = 'bold 28px "Comic Sans MS", sans-serif';
    ctx.fillStyle = '#ff7aa8';
    ctx.fillText('Score:  ' + score, DW / 2, p.y + 218);
    ctx.fillStyle = '#2a6f97'; ctx.font = '20px "Comic Sans MS", sans-serif';
    ctx.fillText('Next level is a little faster...', DW / 2, p.y + 252);
    drawButton('Next Level');
  } else if (state === 'gameover') {
    var p2 = drawCenterPanel(520, 340);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff7aa8';
    ctx.font = 'bold 42px "Comic Sans MS", sans-serif';
    ctx.strokeStyle = '#2a6f97'; ctx.lineWidth = 6;
    ctx.strokeText('Oopsie!', DW / 2, p2.y + 76);
    ctx.fillText('Oopsie!', DW / 2, p2.y + 76);
    drawShell(ctx, 2, DW / 2, p2.y + 136, 28);
    ctx.fillStyle = '#2a6f97';
    ctx.font = '23px "Comic Sans MS", sans-serif';
    ctx.fillText("Let's try Level " + level + ' again!', DW / 2, p2.y + 196);
    ctx.font = 'bold 26px "Comic Sans MS", sans-serif';
    ctx.fillStyle = '#ff7aa8';
    ctx.fillText('Score:  ' + score, DW / 2, p2.y + 234);
    drawButton('Try Again');
  } else if (state === 'win') {
    var p3 = drawCenterPanel(560, 380);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd93d';
    ctx.font = 'bold 46px "Comic Sans MS", sans-serif';
    ctx.strokeStyle = '#2a6f97'; ctx.lineWidth = 7;
    ctx.strokeText('YOU WIN!', DW / 2, p3.y + 74);
    ctx.fillText('YOU WIN!', DW / 2, p3.y + 74);
    ctx.fillStyle = '#ff7aa8';
    ctx.font = '22px "Comic Sans MS", sans-serif';
    ctx.fillText('Pearl finished the Rainbow Necklace!', DW / 2, p3.y + 116);
    ctx.fillText('The whole sea wakes up and throws a party! 🌈', DW / 2, p3.y + 146);
    // final score
    ctx.fillStyle = '#2a6f97';
    ctx.font = 'bold 34px "Comic Sans MS", sans-serif';
    ctx.fillText('Final Score:  ' + score, DW / 2, p3.y + 174);
    ctx.fillStyle = '#ff7aa8'; ctx.font = 'bold 20px "Comic Sans MS", sans-serif';
    ctx.fillText('Best Score:  ' + bestScore, DW / 2, p3.y + 208);
    // row of all shell kinds
    for (var k = 0; k < KINDS.length; k++) {
      drawShell(ctx, k, DW / 2 - (KINDS.length - 1) * 22 + k * 44, p3.y + 256, 18);
    }
    drawButton('Play Again');
  }
}

// ---------------------------------------------------------------------------
// Main render
// ---------------------------------------------------------------------------
function render() {
  ctx.save();
  ctx.scale(scale * dpr, scale * dpr);
  drawBackground();
  drawCreatures();
  drawPalms();
  drawDecorShells();
  drawShellsOnGround();
  drawGirl();
  drawSparkles();
  drawPopups();
  if (state === 'play' || state === 'levelclear' || state === 'gameover') drawHUD();
  if (state === 'play' && bannerTimer > 0) drawBanner();
  // stumble flash
  if (flashTimer > 0) {
    ctx.fillStyle = 'rgba(255,80,80,' + (flashTimer * 0.6) + ')';
    ctx.fillRect(0, 0, DW, DH);
  }
  if (state !== 'play') drawOverlay();
  ctx.restore();
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
function primaryAction() {
  audio();
  if (state === 'play') { doJump(); }
  else if (state === 'menu') { enterStory(1); }
  else if (state === 'story') { startLevel(storyLevel); }
  else if (state === 'levelclear') { enterStory(level + 1); }
  else if (state === 'gameover') { startLevel(level); }   // retry skips the story card
  else if (state === 'win') { state = 'menu'; }
}

window.addEventListener('keydown', function (e) {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter' || e.key === ' ') {
    e.preventDefault();
    primaryAction();
  }
});

function pointerHandler(e) {
  e.preventDefault();
  primaryAction();
}
canvas.addEventListener('pointerdown', pointerHandler);
window.addEventListener('pointerdown', function (e) {
  // allow taps anywhere on the page (letterbox areas) to act too
  if (e.target !== canvas) primaryAction();
});

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
var last = performance.now();
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
